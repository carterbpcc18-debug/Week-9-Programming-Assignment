<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunnydale Solutions - Feedback</title>
    <style>
        #error-box {
            color: red;
            margin-bottom: 15px;
        }

        #success-box {
            color: green;
            margin-bottom: 15px;
        }

        #welcome-box {
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <h1>Sunnydale Solutions</h1>
    <h2>Customer Feedback Form</h2>

    <div id="welcome-box"></div>
    <div id="error-box" role="alert"></div>
    <div id="success-box" role="status"></div>

    <form id="feedback-form" novalidate>
        <label for="reviewer-name">Reviewer Name:</label>
        <input type="text" id="reviewer-name" name="reviewer-name">
        <br><br>

        <label for="rating">Star Rating:</label>
        <select id="rating" name="rating">
            <option value="1">1 Star</option>
            <option value="2">2 Stars</option>
            <option value="3">3 Stars</option>
            <option value="4">4 Stars</option>
            <option value="5" selected>5 Stars</option>
        </select>
        <br><br>

        <label for="comments">Feedback Comments:</label>
        <br>
        <textarea id="comments" name="comments" rows="5" cols="40"></textarea>
        <br><br>

        <button type="submit">Submit Feedback</button>
    </form>

    <script>
        const form = document.getElementById("feedback-form");
        const errorBox = document.getElementById("error-box");
        const successBox = document.getElementById("success-box");
        const welcomeBox = document.getElementById("welcome-box");
        const nameInput = document.getElementById("reviewer-name");

        // Welcome returning reviewers.
        const savedName = localStorage.getItem("reviewerName");

        if (savedName) {
            welcomeBox.textContent =
                "Welcome back, " + savedName +
                "! Ready to submit another wonderful review?";

            nameInput.value = savedName;
        }

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            errorBox.innerHTML = "";
            successBox.textContent = "";

            const name = nameInput.value.trim();
            const rating = Number(
                document.getElementById("rating").value
            );
            const comments = document.getElementById("comments").value;

            const errors = [];

            if (name === "") {
                errors.push("Please provide your name.");
            }

            if (rating !== 5) {
                errors.push(
                    "Our company standard requires a 5-star rating."
                );
            }

            if (!comments.toLowerCase().includes("wonderful")) {
                errors.push(
                    "Comments must include the word 'wonderful'."
                );
            }

            if (errors.length > 0) {
                errorBox.innerHTML =
                    "<ul>" +
                    errors.map(error => "<li>" + error + "</li>").join("") +
                    "</ul>";
                return;
            }

            // Save the reviewer and show the receipt.
            localStorage.setItem("reviewerName", name);

            successBox.textContent =
                "Thank you, " + name +
                "! Your glowing review has been recorded.";

            // Clear the fields and hide the submitted form.
            form.reset();
            form.hidden = true;
        });
    </script>
</body>
</html>
